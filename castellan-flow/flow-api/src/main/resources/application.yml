spring:
  application:
    name: castellan-flow-api
  datasource:
    url: jdbc:h2:mem:castellan-flow;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration

flow:
  timer:
    poll-interval-ms: 500

server:
  port: 8082
